<app-list-detail-container [removePlaceholder]="showTable || showMap">
    @if (selectedEntity && !showMap) {
    <app-caught-details [critter]="selectedEntity" listDetail />
    }

    <mat-tab-group (selectedTabChange)="updateUrl($event); resetLocationFilter()" [selectedIndex]="selectedTabIndex()">
        @for (tab of tabs; track tab) {
        <mat-tab [label]="tab.translationKey ? (tab.translationKey | translate) : tab.title">
            @if ((tab.data |async); as syncedData) {

            <app-data-filter
                [(showMap)]="showMap"
                [(showTable)]="showTable"
                [enableMapView]="true"
                [parentFormGroup]="formControl"
                [locations]="getLocations(syncedData)"
            />
            @if (showMap) {

            <div class="spawn-zone-map-wrapper">
                <img
                    [alt]="
                        'APP.JOURNAL.SPAWN_ZONE_MAP_ALT' | translate : { category: (tab.translationKey | translate) }
                    "
                    [src]="spawnZoneMapPaths[$index]"
                    class="spawn-zone-map"
                />
            </div>

            } @else if (!showTable) {

            <div class="icon-grid">
                @for (entry of syncedData; track entry) {
                <app-item-icon
                    [itemName]="entry.item.iconName"
                    (click)="showDetails(entry)"
                    [class.selected-icon]="selectedEntity?.item?.id === entry.item.id"
                    class="icon-grid-item"
                />
                }
            </div>

            } @else {

            <app-caught-table [dataSource]="syncedData" />

            } }
        </mat-tab>
        }
    </mat-tab-group>
</app-list-detail-container>
