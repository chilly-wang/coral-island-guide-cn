<app-list-detail-container>
    @if (selectedEntity) {
        <app-database-item-details [itemId]="selectedEntity.id" [context]="toDoContext()" listDetail>
            <ng-template let-details appDatabaseItemDetails>
                <app-db-item-found [details]="details"/>
            </ng-template>
        </app-database-item-details>
    }

    <mat-tab-group (selectedTabChange)="updateUrl($event)" [selectedIndex]="selectedTabIndex()">
        @for (tab of tabs; track tab) {
            <mat-tab [label]="tab.translationKey ? (tab.translationKey | translate) : tab.title">
                <app-data-filter [(showTable)]="showTable" [parentFormGroup]="formControl"/>
                <app-status-filter [(value)]="obtainedFilter" [options]="obtainedFilters"/>
                @if ((tab.data |async); as syncedData) {
                    @let visibleData = filterObtained(syncedData);

                    @if (!showTable) {
                        <div class="icon-grid">
                            @for (entry of visibleData; track entry.id) {
                                <div class="icon-grid-item flex flex-col items-center gap-1" [class.selected-icon]="selectedEntity?.id === entry.id">
                                    <app-item-icon (click)="showDetails(entry)"
                                                   [itemName]="entry.iconName"
                                                   class="cursor-pointer"
                                    />
                                    <app-capture-toggle class="text-white" [class.text-black]="selectedEntity?.id === entry.id" [compact]="true"
                                                        wording="obtained" [itemId]="entry.id" [itemName]="entry | localizedEntityName"/>
                                </div>
                            }
                        </div>
                    }
                    @if (showTable) {
                        <app-non-specialized-table [dataSource]="visibleData"/>
                    }

                }
            </mat-tab>
        }
    </mat-tab-group>
</app-list-detail-container>
