<h1 class="font-xl font-bold" mat-dialog-title>{{ 'APP.SAVE_DATA.DELETE_TITLE' | translate }}</h1>
<mat-dialog-content class="prose max-w-full">
    <div class="flex gap-3 font-bold">
        {{ 'APP.SAVE_DATA.DELETE_CONFIRMATION' | translate:{name: dialogData.userData.name} }}
    </div>

</mat-dialog-content>

<mat-dialog-actions class="!justify-between">
    <button class="btn-amber" [matDialogClose]="false">{{ 'APP.SAVE_DATA.CANCEL_DELETE' | translate }}</button>
    <button class="btn-danger space-x-2 items-center" [matDialogClose]="true">
        <app-ui-icon [uiIcon]="UiIcon.TRASH_CAN" class="!size-5"/>
        <span>{{ 'APP.SAVE_DATA.CONFIRM_DELETE' | translate }}</span>
    </button>
</mat-dialog-actions>
