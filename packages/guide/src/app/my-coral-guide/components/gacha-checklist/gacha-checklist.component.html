<app-list-detail-container>
    @if (selectedEntity) {
        <app-database-item-details [itemId]="selectedEntity.id" listDetail/>
    }
    @if (checklistDefinition$ | async; as checklistDefinition) {
        @let tabs = checklistDefinition | keyvalue: null;
        <mat-tab-group (selectedTabChange)="updateUrl(tabs[$event.index].key)" [selectedIndex]="selectedTabIndex()">
            @for (tab of tabs; track tab.key) {
                <mat-tab [formGroup]="checklistForm" [label]="'APP.GACHA.MACHINE.' + tab.key.toUpperCase() | translate">
                    <app-status-filter [(value)]="statusFilter" [options]="statusFilters"/>

                    <div class="icon-grid">
                        @for (entry of filterByStatus(tab.value); track entry.id) {
                            <div
                                    [class.checklist-checked]="checklistForm.get(entry.id)?.value"
                                    [class.selected-icon]="selectedEntity?.id === entry.id"
                                    class="icon-grid-item checklist-item flex flex-col">
                                <app-item-icon (click)="showDetails(entry)" [itemName]="entry.iconName"/>
                                <label class="text-white flex justify-center" for="entry-{{ entry.id }}-input">
                                    <mat-checkbox [formControlName]="entry.id" class="flex" id="entry-{{ entry.id }}"
                                                  name="entry-{{ entry.id }}"/>
                                </label>
                            </div>
                        }
                    </div>
                </mat-tab>
            }
        </mat-tab-group>
    }
</app-list-detail-container>
