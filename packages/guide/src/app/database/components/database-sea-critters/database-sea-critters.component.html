@if (databaseItem().oceanCritter; as oceanCritter) {
    <app-expandable #expandableComponent open>
        <h3 class="database-header" expandableHeader>
            <app-database-header-button [templateRef]="expandableComponent">{{ 'APP.DATABASE.OCEAN_CRITTERS' | translate }}</app-database-header-button>
        </h3>
        <app-caught-table [dataSource]="[oceanCritter]"/>
    </app-expandable>
}
