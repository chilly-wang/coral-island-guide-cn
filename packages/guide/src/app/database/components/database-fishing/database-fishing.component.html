@if (fish) {
    <app-expandable #expandableComponent open>
        <h3 class="database-header" expandableHeader>
            <app-database-header-button [templateRef]="expandableComponent">{{ 'APP.DATABASE.FISHING' | translate }}</app-database-header-button>
        </h3>
        <app-caught-table [dataSource]="[fish]"/>
    </app-expandable>
}
