<app-sidebar-container>
    <app-module-sidebar>
        <app-module-sidebar-item [uiIcon]="uiIcon.OFFERING" [label]="'APP.LOCATIONS.LAKE_TEMPLE' | translate" routerLink="lake-temple"/>

        <app-module-sidebar-item [uiIcon]="uiIcon.CORAL" [label]="'APP.LOCATIONS.ORCHESTRA_ZONES' | translate" routerLink="orchestra-zones"/>

        <app-module-sidebar-item [uiIcon]="uiIcon.STORE" [label]="'APP.LOCATIONS.MERIT_EXCHANGE' | translate" routerLink="merit-exchange"/>
        <app-module-sidebar-item [uiIcon]="uiIcon.TOWN_RANK" [label]="'APP.LOCATIONS.ATTRACTIONS' | translate" routerLink="attractions"/>
        <app-module-sidebar-item [label]="'APP.LOCATIONS.SHOPS' | translate"/>
        @for (shopName of shops; track shopName) {

            <app-module-sidebar-item [routerLink]="shopName"
                                     [uiIcon]="SHOP_ICONS[shopName]">{{ SHOP_DISPLAY_NAMES[shopName] | localizedDisplay:'shop' }}
            </app-module-sidebar-item>
        }
        <app-module-sidebar-item [label]="'APP.LOCATIONS.FESTIVALS' | translate"/>
        @for (festivalName of festivals; track festivalName) {

            <app-module-sidebar-item [routerLink]="festivalName"
                                     [uiIcon]="FESTIVAL_ICONS[festivalName]">{{ FESTIVAL_DISPLAY_NAMES[festivalName] | localizedDisplay:'festival' }}
            </app-module-sidebar-item>

        }

    </app-module-sidebar>
    <router-outlet class="hidden"/>
</app-sidebar-container>
