            </app-module-sidebar-item>
            <app-module-sidebar-item [uiIcon]="UI_ICONS.ARTISAN" routerLink="artisan">{{ 'APP.CRAFTING.PROCESSING' | translate }}

            <app-module-sidebar-item [uiIcon]="UI_ICONS.COOKING" routerLink="cooking">{{ 'APP.CRAFTING.COOKING' | translate }}
            </app-module-sidebar-item>
            <app-module-sidebar-item [uiIcon]="UI_ICONS.PLANT" routerLink="mixing">{{ 'APP.CRAFTING.MIXING' | translate }}
            </app-module-sidebar-item>

        }
